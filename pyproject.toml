[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beryl7-ai-agent"
version = "16.0.0"
description = "Autonomous OpenWrt Network Monitoring & Self-Healing AI Agent"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "paramiko>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.0",
    "detect-secrets>=1.4.0",
]
