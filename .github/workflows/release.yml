name: Release & Multi-Arch Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release Multi-Arch Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go-agent/go.sum

      - name: Compile ARM64 Binary
        run: |
          cd go-agent
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o beryl7-agent-linux-arm64 ./cmd

      - name: Compile AMD64 Binary
        run: |
          cd go-agent
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o beryl7-agent-linux-amd64 ./cmd

      - name: Compile MIPSLE Binary
        run: |
          cd go-agent
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="-s -w" -o beryl7-agent-linux-mipsle ./cmd

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            go-agent/beryl7-agent-linux-arm64
            go-agent/beryl7-agent-linux-amd64
            go-agent/beryl7-agent-linux-mipsle
            scripts/install.sh
            go-agent/procd/beryl7-agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
