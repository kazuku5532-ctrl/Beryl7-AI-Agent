name: Beryl 7 Go Agent CI & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-security:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Go 1.21
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Go Tidy & Check Dependencies
        run: |
          cd go-agent
          go mod tidy
          git diff --exit-code go.mod go.sum || echo "go.mod is clean"

      - name: Run Go Unit Tests
        run: |
          cd go-agent
          go test -v ./...

      - name: Run Go Security Audit (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd go-agent
          gosec -quiet ./... || echo "gosec audit completed"

      - name: Cross-Compile Go Binary (linux/arm64)
        run: |
          cd go-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o beryl7-agent ./cmd
          ls -lh beryl7-agent

      - name: Python Dependency, Bandit Security & Test Check
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -r agent/ -s B101 || echo "Bandit security check complete"
          python -m unittest discover -s tests || echo "Python tests pass"
