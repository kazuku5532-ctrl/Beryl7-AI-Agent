name: Beryl 7 CI/CD Supreme Constitutional Enforcement

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-compliance:
    name: Industry-Standard SAST & Constitutional Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Industry-Standard Security Scanners (gosec & bandit)
        run: |
          curl -sfL https://raw.githubusercontent.com/securego/gosec/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.18.2
          pip install bandit detect-secrets

      - name: Run gosec (Go AST Security & Command Injection Audit)
        run: |
          cd go-agent
          $(go env GOPATH)/bin/gosec ./...

      - name: Run bandit (Python AST Security Audit)
        run: |
          bandit -c .bandit -r tools/

      - name: Run detect-secrets (High Entropy Secret Scanner)
        run: |
          detect-secrets scan --all-files > .secrets.baseline || true

      - name: Execute Constitutional Rule Verification Engine
        run: |
          python tools/dev_scripts/verify_rules.py --full

      - name: Run Complete 10/10 Go Packages Unit Tests
        run: |
          cd go-agent
          go test -v ./...

      - name: Run Static Code Analysis (go vet)
        run: |
          cd go-agent
          go vet ./...

      - name: Cross-Compile Linux ARM64 Binary
        run: |
          cd go-agent
          GOOS=linux GOARCH=arm64 go build -v -o beryl7-agent-arm64 ./cmd
