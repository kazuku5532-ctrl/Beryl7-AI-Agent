name: Beryl 7 CI/CD Supreme Constitutional Enforcement

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  constitutional-audit:
    name: Mandatory System-Wide Rule Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Execute Automated Rule Enforcement Engine
        run: |
          python tools/dev_scripts/verify_rules.py

      - name: Run Complete 10/10 Go Packages Unit Tests
        run: |
          cd go-agent
          go test -v ./...

      - name: Run Static Code Analysis (go vet)
        run: |
          cd go-agent
          go vet ./...

      - name: Cross-Compile Linux ARM64 Binary
        run: |
          cd go-agent
          GOOS=linux GOARCH=arm64 go build -v -o beryl7-agent-arm64 ./cmd
