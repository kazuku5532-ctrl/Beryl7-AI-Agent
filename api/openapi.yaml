openapi: 3.0.3
info:
  title: Beryl 7 AI Agent REST API
  description: Official OpenAPI 3.0 Specification for Beryl 7 AI Network Operations Engine
  version: 15.3.0
servers:
  - url: http://192.168.8.1:8888
    description: Production OpenWrt Native Go Daemon
  - url: http://localhost:5000
    description: Local Python Controller Server
paths:
  /api/health:
    get:
      summary: Get System Telemetry Health Metrics
      responses:
        '200':
          description: Successful telemetry snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                  cpu_usage_pct:
                    type: number
                  ram_usage_pct:
                    type: number
                  hardware_temp_c:
                    type: number
                  latency_ms:
                    type: number
                  uptime_seconds:
                    type: integer
  /metrics:
    get:
      summary: Prometheus Metrics Exporter Endpoint
      responses:
        '200':
          description: Standard Prometheus metrics text output
          content:
            text/plain:
              schema:
                type: string
