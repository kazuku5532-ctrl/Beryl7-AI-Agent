# Prometheus Scrape Configuration for Beryl 7 AI Agent
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'beryl7_agent'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['192.168.8.1:8888']
        labels:
          environment: 'production'
          router_model: 'GL-MT3600BE'

# Prometheus Alert Rules
rule_files:
  - 'beryl7_alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
