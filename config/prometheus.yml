# Prometheus Global Configuration for Beryl 7 AI Agent
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "beryl7-agent"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["192.168.8.1:8888"]
    authorization:
      type: "Bearer"
      credentials: "BERYL7_PROMETHEUS_METRICS_TOKEN"
